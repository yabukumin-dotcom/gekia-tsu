<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ゲキアツ</title><style>
body{margin:0;background:#f6f7f9;color:#17181b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}header{height:62px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900}main{max-width:760px;margin:auto;padding:22px 16px 50px}.hero{text-align:center;padding:22px 0}.hero h1{font-size:40px;margin:0}.hero p{color:#666}.search{display:flex;gap:6px;background:#fff;border:1px solid #ddd;border-radius:16px;padding:6px}.search input{flex:1;border:0;outline:0;padding:13px;font-size:16px}.search button{border:0;background:#111;color:#fff;border-radius:12px;padding:0 18px;font-weight:800}.area{margin:9px 0 15px}.area input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;box-sizing:border-box}.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cat{padding:13px 5px;border:1px solid #ddd;border-radius:12px;background:#fff;font-weight:800}.cat.active{background:#111;color:#fff}#results{margin-top:28px}.head{display:flex;justify-content:space-between}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:16px;margin:11px 0}.rank{font-weight:900}.name{font-size:18px;font-weight:800}.price{font-size:25px;font-weight:900;margin:5px 0}.meta{font-size:13px;color:#555;display:flex;gap:12px;flex-wrap:wrap}.why{background:#f1f2f4;border-radius:10px;padding:10px;margin-top:10px;font-size:13px}.source{font-size:11px;color:#777;margin-top:8px}.go{display:inline-block;margin-top:10px;color:#111;font-weight:800}@media(max-width:500px){.cats{grid-template-columns:1fr}}</style>
<header>ゲキアツ</header><main><section class="hero"><h1>ゲキアツ</h1><p>価格・口コミ・距離をまとめて比較</p></section>
<div class="search"><input id="q" value="ドライヤー" placeholder="商品名を入力"><button onclick="run()">検索</button></div>
<div class="area"><input id="area" value="全国" placeholder="地域"></div>
<div class="cats"><button class="cat" onclick="cat(this,'スーパー')">🛒 スーパー</button><button class="cat" onclick="cat(this,'ドラッグストア')">💊 ドラッグストア</button><button class="cat active" onclick="cat(this,'家電')">📺 家電</button></div>
<section id="results"></section></main>
<script>let category="家電";function cat(e,c){document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));e.classList.add("active");category=c}
async function run(){let q=document.getElementById("q").value.trim(),area=document.getElementById("area").value.trim(),b=document.getElementById("results");if(!q)return;b.innerHTML="<p>検索中…</p>";try{let r=await fetch(`/api/search?q=${encodeURIComponent(q)}&area=${encodeURIComponent(area)}&category=${encodeURIComponent(category)}`),d=await r.json();if(!r.ok)throw Error(d.error||"検索に失敗しました");b.innerHTML=`<div class="head"><h2>「${esc(q)}」</h2><small>実データ検索</small></div>`+d.items.slice(0,3).map((x,i)=>`<article class="card"><div class="rank">${["🥇","🥈","🥉"][i]} ${i+1}位</div><div class="name">${esc(x.name)}</div><div class="price">${x.price?x.price.toLocaleString()+"円":"価格情報なし"}</div><div class="meta"><span>販売店：${esc(x.seller||"—")}</span><span>レビュー：${x.rating??"—"}（${x.review_count??0}件）</span></div><div class="why">価格順を基本に、商品・販売店情報を整理して表示しています。</div><div class="source">情報源：Yahoo!ショッピングAPI</div>${x.url?`<a class="go" href="${x.url}" target="_blank">商品を見る →</a>`:""}</article>`).join("")}catch(e){b.innerHTML=`<p>${esc(e.message)}</p>`}}function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}run();</script></html>
